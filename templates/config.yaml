# Helix Loop: this project's configuration. `helix-loop config` reads and changes it with checks; the app's
# Settings › Loop controls edits it as change sets. Paths in .helix/ are fixed; see docs/project-layout.md.

# The product, who steers its build and does its human tasks, and the time zone dates are written in.
project:
  name: {{NAME}}
  owner: {{OWNER}}
  timezone: {{TIMEZONE}}

# The repositories the loop builds, each a lane. gate: the repo's full check, which a pass must pass before it
# merges into main. prepare: run in a fresh worktree before the agent starts (outside its sandbox), so
# installs are ready. Each repo is cloned into .helix/repos/<name>.
repos:
{{REPOS}}

agents:
  claude:
    enabled: {{CLAUDE}}
    slots: 1
    # Paced so the subscription's weekly window ends at this share used: leave some for your own use.
    weekly_target: 0.85
    command: claude
    models:
      build: { model: claude-opus-5-5, effort: high }
      design: { model: claude-opus-5-5, effort: xhigh }
      plan: { model: claude-opus-5-5, effort: xhigh }
      review: { model: claude-opus-5-5, effort: xhigh }
  codex:
    enabled: {{CODEX}}
    slots: 2
    weekly_target: 0.9
    command: codex
    models:
      build: { model: gpt-6.1-sol, effort: high }
      design: { model: gpt-6-astra, effort: xhigh }
      plan: { model: gpt-6-astra, effort: xhigh }
      review: { model: gpt-6-astra, effort: xhigh }

# Hosts a sandboxed Claude Code pass may reach (Codex's workspace-write sandbox has network on).
# Unlisted hosts are refused; localhost is always reachable.
agent_network:
  allowed_domains:
    - registry.npmjs.org
    - github.com
    - codeload.github.com
    - objects.githubusercontent.com
    - raw.githubusercontent.com
    - cdn.playwright.dev
    - playwright.download.prss.microsoft.com
  # Writable outside the worktree: package stores and browser caches.
  allow_write: ["~/Library/pnpm/store", "~/Library/Caches/pnpm", "~/Library/Caches/ms-playwright"]

# Browser tests for sandboxed agents: a repo's e2e script asks this runner to run its `e2e:direct` script
# outside the sandbox. Port 0 picks a free port.
e2e_runner: { port: 0, script: "e2e:direct", timeout_minutes: 20, concurrency: 2 }

limits:
  pass_timeout_minutes: 60
  gate_timeout_minutes: 30
  concurrent_gates: 2
  prompt_budget_bytes: 40000
  agents_md_budget_bytes: 8000
  max_attempts: 3
  max_conflicts: 3
  # Notional list-price spend per agent per day: subscriptions don't bill per token, but the cap stops a
  # runaway from spending the week's allowance in a day.
  daily_budget_usd: { claude: 1600, codex: 1600 }
  codex_price_per_mtok: { input: 1.25, cached_input: 0.125, output: 10 }
  suspension_threshold_seconds: 30
  unknown_reset_backoff_minutes: { first: 5, max: 60 }

# Paths no agent may change in a product repo; a pass touching them is refused at the gate.
forbidden_paths: [".claude/**", ".codex/**", ".pnpm-store/**", "**/.env", "**/.env.*", "**/*.pem", "**/*.key"]
forbidden_exceptions: ["**/.env.example"]
# Paths only tasks in a given area may change (glob: area prefix).
restricted_paths:
  .github/workflows/**: ci

# Push to origin after each merge, once the repo has a remote.
push: true
# Files many tasks append to: rebases keep both sides instead of conflicting.
union_merge_paths: [AGENTS.md]
# Lockfiles a rebase regenerates when they are all that conflicts.
relock: { pnpm-lock.yaml: "pnpm install --lockfile-only --no-frozen-lockfile --prefer-offline" }
# Manifests a rebase merges key by key when they conflict, then formats with the command given.
json_merge: { package.json: "" }
metrics_every_passes: 100

# Release tags, per repo: every N merged tasks, when a stage closes with unreleased work, and on
# `helix-loop release run <repo>`. A release that changes a reviewed path waits for `helix-loop release approve`.
release:
  every_merged_tasks: 150
  review_paths: [".github/**", "infra/**"]

notify:
  macos: true

# The app (`helix-loop app`), on 127.0.0.1 only.
app:
  port: 47320

helix:
  # Helix's monitor watches the loop while it runs; its turns spend the agents' subscriptions, so it starts off.
  monitor: { enabled: false, level: light }
