# Example Helix TaskSet: a product waitlist, built in two lanes.
# The app lane takes sign-ups and sends the confirmation; the website lane shows the form.
# Lanes are the repositories the project's config names; stages are this TaskSet's own milestones.
version: 1
stages:
  - { key: day0, title: "Day 0: Skeleton" }
  - { key: day1, title: "Day 1: Waitlist" }
# Both finish dates: project complete counts the human tasks' lead times (HT-1 waits up to two days on
# domain verification); code complete leaves them out.
timelines: [code, project]
lanes:
  acme-app:
    repo: acme-app
    epics:
      waitlist-core:
        title: Waitlist sign-up, confirmation and export
        stage: day1
  acme-website:
    repo: acme-website
    epics:
      waitlist-page:
        title: Waitlist form and confirmation page
        stage: day1
